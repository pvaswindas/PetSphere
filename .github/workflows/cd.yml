name: PetSphere CD

on:
  workflow_run:
    workflows: ['PetSphere CI']
    types:
      - completed
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create and verify deployment files
        run: |
          DOCKERHUB_USER_ESCAPED=$(printf '%s\n' "${{ secrets.DOCKERHUB_USERNAME }}" | sed 's/[&/\]/\\&/g')
          sed "s/\${DOCKERHUB_USERNAME}/$DOCKERHUB_USER_ESCAPED/g" Server/docker-compose.prod.yml > docker-compose.prod.yml
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,.env"
          target: "/home/ubuntu/petsphere"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/petsphere
            docker-compose -f docker-compose.prod.yml down || true
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
            docker system prune -f