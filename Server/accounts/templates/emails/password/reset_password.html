<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <!-- Bootstrap CSS (from a CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ4QY7KJb7Xb3p0pP2V1miK6ad9dtqLbzO2G3u4DhF0g7O+Gi/XAlzQWz8+J" crossorigin="anonymous">
</head>
<body style="background-color: #f4f4f4; padding: 20px;">

    <div class="container" style="max-width: 600px; background-color: #ffffff; padding: 30px; border-radius: 8px;">
        <div class="text-center">
            <h2>Password Reset Request</h2>
            <p class="text-muted">We received a request to reset your password. Click the button below to reset it.</p>
        </div>

        <div class="text-center mt-4">
            <!-- Bootstrap Button with Link -->
            <a href="{{ reset_url }}" class="btn btn-primary btn-lg">Click here to reset your password</a>
        </div>

        <p class="mt-4">The link will expire in 10 minutes.</p>

        <div class="text-center mt-4">
            <p class="text-muted" style="font-size: 12px;">If you did not request a password reset, please ignore this email.</p>
        </div>
    </div>

</body>
</html>
